# Deploys to Firebase Hosting on every push to main, once the secrets exist.
# Until FIREBASE_SERVICE_ACCOUNT is set, this job is skipped (see HUMAN.md).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
          VITE_PAY_INSTRUCTIONS: ${{ vars.VITE_PAY_INSTRUCTIONS }}
          VITE_CHECKOUT_URL_MONTHLY: ${{ vars.VITE_CHECKOUT_URL_MONTHLY }}
          VITE_CHECKOUT_URL_YEARLY: ${{ vars.VITE_CHECKOUT_URL_YEARLY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
      - name: Deploy Firestore rules and indexes
        run: npx firebase-tools deploy --only firestore --project "$PROJECT" --non-interactive
        env:
          PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        if: false # enable after writing the service account to ${{ runner.temp }}/sa.json in a prior step; kept off until HUMAN.md step 2 is done
